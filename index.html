<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="星勢 StarMomentum：看準勢頭，發現下一顆新星。每日三次，以可解釋數據排名 GitHub 上升中的開源項目。" />
    <meta name="theme-color" content="#f6f8fa" />
    <script>
      // Apply the saved theme before first paint so dark and black themes never flash white.
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark' || theme === 'black') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>星勢 StarMomentum｜GitHub 上升中的開源項目</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
